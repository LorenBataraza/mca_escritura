# Mapeo: dibujo de Excalidraw  ->  figura de la tesis
#
#   <archivo .svg en el vault>  TAB  <capitulo>/<nombre sin extension>
#
# El origen es ~/Dropbox/DropsyncFiles/Obsidian/Lorenzo/Excalidraw/ (lo pone
# ahi el auto-export de Excalidraw). El destino cuelga de figs/, y el nombre
# lleva el prefijo del capitulo como el resto del template (cap1_esquema,
# cap2_espectro) para que no haya colisiones entre carpetas.
#
# Despues de convertir, en el .tex va sin carpeta ni extension, porque lo
# resuelve el \graphicspath del principio del capitulo:
#
#   \includegraphics[width=\imsize]{cap1_cadena_adquisicion}
#
# El reparto por capitulo de abajo es una PRIMERA APROXIMACION, hecha a ojo
# desde el nombre del dibujo. Movelos al capitulo que corresponda; para eso
# alcanza con editar la columna de la derecha y volver a correr el script.
# Comenta con # lo que todavia no entra en la tesis.

